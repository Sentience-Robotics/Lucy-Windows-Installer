name: Build Windows installer

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish application
        run: >
          dotnet publish Lucy-windows-installer.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output publish

      - name: Rename executable
        shell: pwsh
        run: |
          $executable = Get-ChildItem -Path publish -Filter *.exe | Select-Object -First 1
          if ($null -eq $executable) {
            throw "The published executable was not found."
          }
          Rename-Item -Path $executable.FullName -NewName "Lucy.exe"

      - name: Package executable
        shell: pwsh
        run: |
          if (-not (Test-Path "publish\Lucy.exe")) {
            throw "Lucy.exe was not found after publishing."
          }

          Compress-Archive `
            -Path "publish\Lucy.exe" `
            -DestinationPath "Lucy-installer-exe.zip" `
            -CompressionLevel Optimal `
            -Force

          if (-not (Test-Path "Lucy-installer-exe.zip")) {
            throw "The executable archive was not created."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead("$PWD\Lucy-installer-exe.zip")
          try {
            if ($archive.Entries.Count -ne 1 -or $archive.Entries[0].Name -ne "Lucy.exe") {
              throw "The executable archive contents are invalid."
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Upload executable archive
        uses: actions/upload-artifact@v4
        with:
          name: Lucy-installer-exe
          path: Lucy-installer-exe.zip
          compression-level: 0
          if-no-files-found: error
